</script>
    <style>
    :root {
      --navy: #1A1A2E;
      --navy-2: #12121F;
      --blue: #C85A28;
      --blue-dark: #A04620;
      --gold: #D4A574;
      --gold-light: #E8C9A8;
      --ink: #2B2B2B;
      --rust: #C85A28;
      --rust-hover: #A04620;
      --charcoal: #2B2B2B;
      --muted: #5d6880;
      --surface: #E0E0E0;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --duration: 0.35s;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background: #E0E0E0;
      text-rendering: optimizeLegibility;
      transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out);
    }
    html.dark body {
      background: #000055;
      color: #e8ecf4;
    }
    ::selection { background: #d4d4d4; color: var(--navy); }
    html.dark ::selection { background: #1e3a8a; color: #fff; }

    /* Theme: only paint-friendly properties, scoped */
    .theme-surface {
      transition: background-color 0.35s var(--ease-out), border-color 0.35s var(--ease-out), color 0.35s var(--ease-out);
    }

    .grid-noise {
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .hero-glow {
      background:
        radial-gradient(circle at 85% 15%, rgba(65,105,225,.55), transparent 27%),
        radial-gradient(circle at 8% 95%, rgba(255,102,0,.17), transparent 30%),
        linear-gradient(145deg, #1A1A2E 0%, #12121F 58%, #1A1A2E 100%);
    }
    html.dark .hero-glow {
      background:
        radial-gradient(circle at 85% 15%, rgba(65,105,225,.4), transparent 27%),
        radial-gradient(circle at 8% 95%, rgba(255,102,0,.12), transparent 30%),
        linear-gradient(145deg, #0D0D18 0%, #1A1A2E 58%, #0D0D18 100%);
    }
    /* Section rhythm - fixed palette, same in light and dark mode by design */
    .section-gradient {
      background:
        radial-gradient(ellipse 80% 60% at 15% 0%, rgba(200,90,40,.22), transparent 55%),
        radial-gradient(ellipse 70% 55% at 95% 100%, rgba(212,165,116,.16), transparent 55%),
        linear-gradient(155deg, #1A1A2E 0%, #302E3C 55%, #3D3A42 100%);
      color: #F5F5F5;
    }
    .section-dark {
      background: #1A1A2E;
      color: #F5F5F5;
    }
    .section-light {
      background: #D9D5CD;
      color: #2B2B2B;
    }
    .shadow-soft { box-shadow: 0 20px 60px rgba(7,19,51,.10); }
    html.dark .shadow-soft { box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .shadow-blue { box-shadow: 0 16px 40px rgba(65,105,225,.24); }
    .focusable:focus-visible {
      outline: 3px solid #C85A28;
      outline-offset: 3px;
    }

    /* GPU-composited phone ring - transform only */
    .phone-ring {
      animation: ring 2.6s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
      backface-visibility: hidden;
    }
    @keyframes ring {
      0%, 72%, 100% { transform: rotate(0deg) translateZ(0); }
      77% { transform: rotate(8deg) translateZ(0); }
      82% { transform: rotate(-7deg) translateZ(0); }
      87% { transform: rotate(5deg) translateZ(0); }
      92% { transform: rotate(-3deg) translateZ(0); }
    }

    /* Keyframes: opacity + transform only (compositor-friendly) */
    @keyframes fade-up {
      from { opacity: 0; transform: translate3d(0, 24px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale3d(0.96, 0.96, 1); }
      to { opacity: 1; transform: scale3d(1, 1, 1); }
    }
    @keyframes slide-down {
      from { opacity: 0; transform: translate3d(0, -10px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes accordion-open {
      from { opacity: 0; transform: translate3d(0, -6px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes success-pop {
      0% { opacity: 0; transform: scale3d(0.92, 0.92, 1); }
      100% { opacity: 1; transform: scale3d(1, 1, 1); }
    }

    /* Scroll reveals - compositor path only */
    .reveal {
      opacity: 0;
      transform: translate3d(0, 24px, 0);
      transition: opacity 0.55s var(--ease-out), transform 0.55s var(--ease-out);
      will-change: opacity, transform;
      contain: layout style;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
    /* Drop will-change after settle to free GPU layers */
    .reveal.is-visible.is-settled {
      will-change: auto;
    }
    .reveal-delay-1 { transition-delay: 0.06s; }
    .reveal-delay-2 { transition-delay: 0.12s; }
    .reveal-delay-3 { transition-delay: 0.18s; }
    .reveal-delay-4 { transition-delay: 0.24s; }

    .hero-animate-title {
      animation: fade-up 0.65s var(--ease-out) both;
    }
    .hero-animate-sub {
      animation: fade-up 0.65s var(--ease-out) 0.1s both;
    }
    .hero-animate-cta {
      animation: fade-up 0.65s var(--ease-out) 0.18s both;
    }
    .hero-animate-card {
      animation: scale-in 0.7s var(--ease-out) 0.14s both;
      backface-visibility: hidden;
    }

    .mobile-nav-enter {
      animation: slide-down 0.25s var(--ease-out) both;
    }
    .faq-answer-enter {
      animation: accordion-open 0.28s var(--ease-out) both;
    }
    .success-enter {
      animation: success-pop 0.4s var(--ease-out) both;
      backface-visibility: hidden;
    }

    /* Activation path - first-run / form / success */
    @keyframes check-draw {
      from { opacity: 0; transform: scale3d(0.6, 0.6, 1); }
      to { opacity: 1; transform: scale3d(1, 1, 1); }
    }
    @keyframes success-stagger {
      from { opacity: 0; transform: translate3d(0, 12px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes pulse-ring {
      0% { transform: scale3d(1, 1, 1); opacity: 0.5; }
      100% { transform: scale3d(1.55, 1.55, 1); opacity: 0; }
    }
